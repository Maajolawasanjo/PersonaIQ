<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_97 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_97" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_97');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const scene = new THREE.Scene();
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x750013, 2); // MIT Deep Red
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

const topLight = new THREE.DirectionalLight(0xffffff, 1);
topLight.position.set(0, 10, 0);
scene.add(topLight);

// Presence Prisms (Abstract Geometry)
const group = new THREE.Group();
const count = 8;
const prisms = [];

for (let i = 0; i < count; i++) {
    const geometry = new THREE.IcosahedronGeometry(Math.random() * 0.8 + 0.4, 0);
    const material = new THREE.MeshPhysicalMaterial({
        color: i % 2 === 0 ? 0x750013 : 0xffffff,
        metalness: 0.1,
        roughness: 0.05,
        transmission: 0.9,
        thickness: 0.5,
        transparent: true,
        opacity: 0.6,
        envMapIntensity: 1
    });

    const prism = new THREE.Mesh(geometry, material);
    prism.position.set(
        (Math.random() - 0.5) * 8,
        (Math.random() - 0.5) * 4,
        (Math.random() - 0.5) * 2
    );
    prism.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    
    // Add wireframe overlay for "intelligence" look
    const wireframe = new THREE.LineSegments(
        new THREE.WireframeGeometry(geometry),
        new THREE.LineBasicMaterial({ color: 0x750013, transparent: true, opacity: 0.2 })
    );
    prism.add(wireframe);
    
    group.add(prism);
    prisms.push({
        mesh: prism,
        speed: Math.random() * 0.01 + 0.005,
        axis: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize()
    });
}
scene.add(group);

// Mouse Interaction
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

// Resize handler
window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

function animate(t) {
    requestAnimationFrame(animate);
    
    // Ambient rotation
    group.rotation.y += 0.002;
    group.rotation.x += 0.001;
    
    // Individual prism behavior
    prisms.forEach((p, i) => {
        p.mesh.rotateOnAxis(p.axis, p.speed);
        p.mesh.position.y += Math.sin(t * 0.001 + i) * 0.002;
    });

    // Mouse influence
    group.position.x += (mouseX * 0.5 - group.position.x) * 0.05;
    group.position.y += (-mouseY * 0.5 - group.position.y) * 0.05;

    renderer.render(scene, camera);
}
animate(0);
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_97 -->
</body>
</html>
