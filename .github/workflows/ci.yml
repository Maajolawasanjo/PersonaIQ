name: PERSONAIQ CI
on:
  push:
    branches: [main, develop, 'audit/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: personaiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt pytest-asyncio
      - name: Run backend tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/personaiq_test
          SECRET_KEY: ci-only-personaiq-long-nonproduction-signing-key
          JWT_SECRET_KEY: ci-only-personaiq-long-nonproduction-signing-key
          ENVIRONMENT: testing
          ENABLE_EMAIL_NOTIFICATIONS: 'false'
          SMTP_HOST: mock.smtp
          SMTP_USER: no-reply@personaiq.example
          SMTP_PASSWORD: mock-password
          EMAILS_FROM_EMAIL: no-reply@personaiq.example
          CI: 'true'
          DEBUG: 'false'
        run: pytest -q

  frontend-build:
    name: Frontend TypeScript and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter web exec tsc --noEmit
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: pnpm --filter web build

  security-audit:
    name: Dependency security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r apps/api/requirements.txt
      - name: JavaScript dependencies
        run: pnpm audit --audit-level high
